<!doctype html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RongTana Admin</title><link rel="stylesheet" href="/style.css">
<style>
body{background:#f7f5f2}.admin{padding:24px 0 50px}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}.panel{background:#fff;padding:20px;border-radius:18px;box-shadow:0 6px 24px #00000010}.form{display:grid;gap:11px}.form input,.form select,.form textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.form textarea{min-height:90px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload{border:2px dashed #d7c3a8;padding:14px;border-radius:14px;text-align:center}.upload img{display:none;width:100%;max-height:220px;object-fit:contain;margin-top:10px;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.edit{background:#f3e8ff;color:#6b21a8}.danger{background:#fee2e2;color:#991b1b}.muted{font-size:13px;color:#666}.ok{color:#087f5b;font-weight:700}.bad{color:#b42318;font-weight:700}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{border:1px solid #eee;border-radius:14px;overflow:hidden}.card img{width:100%;height:170px;object-fit:cover;background:#eee}.card .body{padding:12px}.badge{font-size:12px;background:#f4efe8;padding:4px 8px;border-radius:99px}.price{font-weight:800;font-size:18px;margin:6px 0}.orders{margin-top:20px;overflow:auto}.orders table{width:100%;border-collapse:collapse}.orders th,.orders td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.status{padding:7px;border:1px solid #ddd;border-radius:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}@media(max-width:500px){.products{grid-template-columns:1fr 1fr}.panel{padding:15px}}
</style></head>
<body><header class="topbar"><div class="container nav"><a class="brand" href="/"><span>R</span>RongTana Admin</a><a href="/">← Store</a></div></header>
<main class="container admin"><div class="grid">
<section class="panel"><h2 id="title">নতুন চুড়ি যোগ করুন</h2><form id="form" class="form"><input type="hidden" name="id"><input name="name" placeholder="চুড়ির / পণ্যের নাম" required>
<div class="two"><select name="category"><option>Bridal</option><option>Stone</option><option>Glass</option><option>Premium</option></select><input name="price" type="number" min="0" placeholder="দাম (৳)" required></div>
<input name="stock" type="number" min="0" placeholder="স্টক" required>
<div class="upload"><b>চুড়ির ছবি আপলোড করুন</b><input id="file" type="file" accept="image/*" style="margin-top:10px"><img id="preview"><input type="hidden" name="image"></div>
<textarea name="description" placeholder="বর্ণনা"></textarea><div class="actions"><button class="btn primary" id="save">পণ্য যোগ করুন</button><button class="btn" id="cancel" type="button" style="display:none">Cancel</button></div><div id="msg" class="muted"></div></form>
<p class="muted">ছবি সর্বোচ্চ 5MB। মোবাইল থেকেও Gallery/Camera থেকে ছবি বাছাই করা যাবে।</p></section>
<section class="panel"><h2>পণ্যসমূহ</h2><div id="products" class="products"></div></section></div>
<section class="panel orders"><h2>Orders</h2><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody id="orders"></tbody></table></section></main>
<script>
const $=s=>document.querySelector(s), money=n=>'৳ '+Number(n).toLocaleString('en-BD');
const form=$('#form'), preview=$('#preview'), msg=$('#msg');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
$('#file').onchange=()=>{const f=$('#file').files[0];if(!f)return;if(f.size>5242880){msg.textContent='ছবির সাইজ 5MB-এর বেশি হতে পারবে না।';msg.className='bad';$('#file').value='';return}const r=new FileReader();r.onload=()=>{form.image.value=r.result;preview.src=r.result;preview.style.display='block'};r.readAsDataURL(f)};
function reset(){form.reset();form.id.value='';form.image.value='';preview.src='';preview.style.display='none';$('#title').textContent='নতুন চুড়ি যোগ করুন';$('#save').textContent='পণ্য যোগ করুন';$('#cancel').style.display='none';msg.textContent='';msg.className='muted'}
$('#cancel').onclick=reset;
async function load(){const d=await fetch('/api/products').then(r=>r.json());$('#products').innerHTML=d.length?d.map(p=>'<article class="card"><img src="'+p.image+'" onerror="this.style.display=\'none\'"><div class="body"><span class="badge">'+esc(p.category)+'</span><b style="display:block;margin-top:6px">'+esc(p.name)+'</b><div class="muted">স্টক: '+p.stock+'</div><div class="price">'+money(p.price)+'</div><div class="actions"><button class="btn edit" onclick="edit('+p.id+')">Edit</button><button class="btn danger" onclick="del('+p.id+')">Delete</button></div></div></article>').join(''):'<p class="muted">এখনও কোনো পণ্য নেই।</p>'}
async function edit(id){const p=await fetch('/api/products/'+id).then(r=>r.json());form.id.value=p.id;form.name.value=p.name;form.category.value=p.category;form.price.value=p.price;form.stock.value=p.stock;form.description.value=p.description||'';form.image.value=p.image||'';if(p.image){preview.src=p.image;preview.style.display='block'}$('#title').textContent='পণ্য Edit করুন';$('#save').textContent='Update Product';$('#cancel').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}
async function del(id){if(!confirm('এই পণ্যটি Delete করবেন?'))return;await fetch('/api/admin/products/'+id,{method:'DELETE'});load()}
form.onsubmit=async e=>{e.preventDefault();const id=form.id.value,body={name:form.name.value.trim(),category:form.category.value,price:Number(form.price.value),stock:Number(form.stock.value),image:form.image.value,description:form.description.value.trim()};const r=await fetch(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok){msg.textContent=d.message||'Save করা যায়নি';msg.className='bad';return}reset();load()};
async function orders(){const d=await fetch('/api/admin/orders').then(r=>r.json());$('#orders').innerHTML=d.length?d.map(o=>'<tr><td>#'+o.id+'<br><small>'+new Date(o.createdAt).toLocaleString()+'</small></td><td><b>'+esc(o.customer.name)+'</b><br>'+esc(o.customer.phone)+'<br>'+esc(o.customer.address)+'</td><td>'+o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')+'</td><td>'+money(o.total)+'</td><td><select class="status" onchange="status('+o.id+',this.value)">'+['Pending','Confirmed','Shipped','Delivered','Cancelled'].map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join(''):'<tr><td colspan="5">এখনও কোনো অর্ডার নেই।</td></tr>'}
async function status(id,v){await fetch('/api/admin/orders/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:v})})}
load();orders();
</script></body></html>
